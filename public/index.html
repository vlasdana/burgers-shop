<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Burger Shop App</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <main>
      <div class="container">
        <header>
          <img src="../media/burger.png" />

          <h1>Burger Shop Manager</h1>
          <nav>
            <ul>
              <li><a href="/burgers">Burgers</a></li>
              <li><a href="/drinks">Drinks</a></li>
            </ul>
          </nav>
        </header>

        <form id="open_form" method="get" action="/add">
          <button id="openForm-btn" type="submit">Add product</button>
        </form>
        <div id="successMessage" style="display: none">
          <p>Data is successfully saved!</p>
        </div>
      </div>
    </main>
    <footer>2024</footer>
  </body>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
    crossorigin="anonymous"
  ></script>
  <script>
    window.onload = function () {
      console.log("Pagina a fost încărcată."); // Pentru a verifica dacă scriptul este executat
      const urlParams = new URLSearchParams(window.location.search);
      const isSaved = urlParams.get("saved");
      console.log("isSaved:", isSaved); // Pentru a verifica valoarea lui isSaved

      if (isSaved === "true") {
        //alert("Datele din formular au fost salvate cu succes!");
        // sau actualizează DOM-ul pentru a afișa mesajul în pagina
        document.getElementById("successMessage").style.display = "block";
      }
    };
  </script>
</html>
